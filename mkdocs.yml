# ============================================================================
# CxPortal Documentation — MkDocs Material configuration
#
# Published to: https://docs.caylent.com/cxportal/
# The /cxportal/ subpath is set via site_url below and enforced at deploy
# time by the AWS deployment workflow (.github/workflows/deploy-docs.yml).
# ============================================================================

site_name: CxPortal Documentation
site_url: !ENV [SITE_URL, "https://docs.caylent.com/cxportal/"]
site_description: Caylent CxPortal product documentation
# use_directory_urls keeps clean URLs (e.g. /page/ instead of /page.html)
use_directory_urls: true

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
theme:
  name: material
  language: en
  features:
    - navigation.instant      # faster page loads (SPA-style)
    - navigation.tracking     # URL updates as you scroll
    - navigation.top          # "back to top" button
    - navigation.sections     # group nav items into sections
    - search.suggest          # autocomplete in the search box
    - search.highlight        # highlight matches on the page
    - content.code.copy       # copy button on code blocks
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# ---------------------------------------------------------------------------
# Built-in search (replaces GitBook search)
# ---------------------------------------------------------------------------
plugins:
  - search
  # ---------------------------------------------------------------------------
  # Redirects (mkdocs-redirects)
  #
  # CONVENTION -- READ BEFORE RENAMING OR MOVING ANY PAGE:
  #   MkDocs derives a page's URL from its file path, so renaming or moving a
  #   .md file CHANGES its published URL and breaks every existing link and
  #   bookmark to the old one. Whenever you rename or move a page you MUST add
  #   an entry below mapping the OLD path to the NEW path:
  #
  #       'old/path.md': 'new/path.md'
  #
  #   Both sides are paths relative to docs/, written with the .md extension.
  #   The left side is the page that no longer exists (its file is gone); the
  #   right side is where it now lives. mkdocs-redirects then publishes a tiny
  #   HTML stub at the old URL that forwards visitors to the new one.
  #
  #   Keep old entries indefinitely -- links live on in emails, tickets, and
  #   bookmarks long after a page moves.
  # ---------------------------------------------------------------------------
  - redirects:
      redirect_maps:
        # Seed example (verified): the short "/getting-started/" slug forwards
        # to the full Getting Started page. Add one line per future move.
        'getting-started.md': 'getting-started-with-cxportal.md'

# ---------------------------------------------------------------------------
# Markdown extensions (nice-to-haves that match common GitBook content)
# ---------------------------------------------------------------------------
markdown_extensions:
  - admonition            # note/warning/tip callout boxes
  - attr_list
  - md_in_html            # required for the "grid cards" homepage layout
  - tables
  - toc:
      permalink: true     # anchor link on each heading
  - pymdownx.highlight    # syntax highlighting for code
  - pymdownx.superfences  # fenced code + nested blocks
  - pymdownx.details      # collapsible sections
  - pymdownx.emoji:       # renders :material-*: / :octicons-*: icons (homepage cards)
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# ---------------------------------------------------------------------------
