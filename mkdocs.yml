# resolve, all the product folders (Cases/, access-management/, campaigns/,
# pinpoint/, etc.) and the loose top-level .md files must be MOVED INTO
# docs/, keeping their folder structure. Files not listed here still publish
# (MkDocs just won't put them in the menu).
# ---------------------------------------------------------------------------
